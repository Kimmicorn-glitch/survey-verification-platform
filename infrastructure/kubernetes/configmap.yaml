apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: survey-verification-platform
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/part-of: survey-verification-platform
data:
  api-url: "https://surveyverification.com/api"
  ai-url: "https://surveyverification.com/ai"
  redis-host: "redis-master"
  redis-port: "6379"
  redis-url: "redis://redis-master:6379"
  postgres-host: "postgres-primary"
  postgres-port: "5432"
  postgres-database: "survey_verification"
  grafana-url: "https://grafana.surveyverification.com"
  log-level: "info"
  cors-allowed-origins: "https://surveyverification.com,https://www.surveyverification.com"
  max-upload-size: "50MB"
  request-timeout: "300"
  rate-limit-requests: "30"
  rate-limit-window: "1m"
