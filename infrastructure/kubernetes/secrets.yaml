apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: survey-verification-platform
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/part-of: survey-verification-platform
type: Opaque
stringData:
  database-url: "postgresql://PROVIDED_USER:PROVIDED_PASSWORD@postgres-primary:5432/survey_verification"
  database-username: "PROVIDED_USER"
  database-password: "PROVIDED_PASSWORD"
  jwt-secret: "PROVIDED_JWT_SECRET"
  jwt-expiration: "86400"
  redis-password: "PROVIDED_REDIS_PASSWORD"
  redis-url: "redis://:PROVIDED_REDIS_PASSWORD@redis-master:6379"
  nft-private-key: "PROVIDED_NFT_PRIVATE_KEY"
  nft-contract-address: "PROVIDED_NFT_CONTRACT_ADDRESS"
  nft-rpc-url: "PROVIDED_NFT_RPC_URL"
  ai-api-key: "PROVIDED_AI_API_KEY"
  smtp-password: "PROVIDED_SMTP_PASSWORD"
  sentry-dsn: "PROVIDED_SENTRY_DSN"
  encryption-key: "PROVIDED_ENCRYPTION_KEY"
