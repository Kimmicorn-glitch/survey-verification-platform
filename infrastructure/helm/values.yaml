global:
  environment: production
  imageRegistry: ghcr.io/backofficepro
  imagePullSecrets:
    - name: ghcr-secret

replicaCount:
  backend: 3
  frontend: 3
  aiEngine: 2

image:
  backend:
    repository: ghcr.io/backofficepro/survey-platform-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/backofficepro/survey-platform-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  aiEngine:
    repository: ghcr.io/backofficepro/survey-platform-ai-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  nginx:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  frontend:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  aiEngine:
    type: ClusterIP
    port: 8081
    targetPort: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: surveyplatform.backofficepro.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /ai
          pathType: Prefix
          service: aiEngine
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: survey-platform-tls
      hosts:
        - surveyplatform.backofficepro.com

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  aiEngine:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: false
  host: survey-platform-db.cluster-xxxxx.eu-west-1.rds.amazonaws.com
  port: 5432
  database: surveyplatform
  existingSecret: survey-platform-db-credentials
  existingSecretKey: password

redis:
  enabled: false
  host: survey-platform-redis.xxxxx.0001.euw1.cache.amazonaws.com
  port: 6379
  existingSecret: survey-platform-redis-credentials

config:
  backend:
    SPRING_PROFILES_ACTIVE: production
    JWT_SECRET_KEY: ""
    STRIPE_API_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    REDIS_HOST: ""
    REDIS_PORT: "6379"
  aiEngine:
    PORT: "8081"
    JWT_SECRET: ""
    MODEL_DIR: "/models"
    VERIFICATION_API_URL: "http://survey-platform-backend:8080"

secrets:
  enabled: true
  existingSecret: survey-platform-secrets

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
