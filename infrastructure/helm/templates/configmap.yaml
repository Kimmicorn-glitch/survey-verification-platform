apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-config
  labels:
    {{- include "survey-platform.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.global.environment | default "production" }}
  SERVER_PORT: "{{ .Values.service.backend.targetPort }}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_SHOW_SQL: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_EXCLUDE: "env,beans,configprops"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  {{- range $key, $value := .Values.config.backend }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
