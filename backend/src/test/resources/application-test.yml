spring:
  datasource:
    url: jdbc:tc:postgresql:16:///surveyplatform
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  redis:
    host: localhost
    port: 6379

  jwt:
    secret: test-jwt-secret-for-integration-tests-only
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000

  security:
    cors:
      allowed-origins: http://localhost:3000

  stripe:
    api-key: sk_test_fake_key_for_testing
    webhook-secret: whsec_fake_secret_for_testing

  resilience4j:
    ratelimiter:
      instances:
        default:
          limit-for-period: 100
          limit-refresh-period: 1m
          timeout-duration: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO
    com.backofficepro.surveyplatform: DEBUG
