name: Secret Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan (filesystem)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
          path: ./
          base: ${{ github.event.repository.default_branch }}

      - name: TruffleHog Scan (GitHub)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
          github-token: ${{ secrets.GITHUB_TOKEN }}
          org: backofficepro
          json: true

  gitleaks-custom:
    name: Custom Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for API Keys
        uses: danielrherber/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Scan environment files
        run: |
          echo "Scanning for secrets in .env files..."
          find . -name "*.env" -o -name ".env.*" -o -name "*.env.local" -o -name "*.env.production" | \
            grep -v node_modules | \
            grep -v .git | \
            while read f; do
              echo "Checking: $f"
              if grep -qE "(password|secret|key|token)\\s*=\\s*['\"][^'\\\"]+['\"]" "$f" 2>/dev/null; then
                echo "WARNING: Potential secret found in $f"
              fi
            done

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded credentials..."
          rg -i --no-heading \
            "(password|passwd|pwd)\s*[=:]\s*['\"][^'\"]+['\"]" \
            --glob '!node_modules/**' \
            --glob '!.git/**' \
            --glob '!*.lock' \
            --glob '!*.min.js' \
            . || true

          rg -i --no-heading \
            "(api_key|apikey|api-key)\s*[=:]\s*['\"][^'\"]+['\"]" \
            --glob '!node_modules/**' \
            --glob '!.git/**' \
            --glob '!*.lock' \
            --glob '!*.min.js' \
            . || true

          rg -i --no-heading \
            "(secret_key|secret-key|secretkey)\s*[=:]\s*['\"][^'\"]+['\"]" \
            --glob '!node_modules/**' \
            --glob '!.git/**' \
            --glob '!*.lock' \
            --glob '!*.min.js' \
            . || true

          rg -i --no-heading \
            "(private_key|private-key|privatekey)\s*[=:]\s*['\"][^'\"]+['\"]" \
            --glob '!node_modules/**' \
            --glob '!.git/**' \
            --glob '!*.lock' \
            --glob '!*.min.js' \
            . || true
