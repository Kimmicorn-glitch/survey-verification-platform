name: CD Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: "false"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "ai-engine=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-engine:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "nginx=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "frontend-latest=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:staging-latest" >> $GITHUB_OUTPUT
          echo "backend-latest=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:staging-latest" >> $GITHUB_OUTPUT
          echo "ai-engine-latest=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-engine:staging-latest" >> $GITHUB_OUTPUT
          echo "nginx-latest=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:staging-latest" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ steps.tags.outputs.frontend-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ steps.tags.outputs.backend-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ai-engine
          push: true
          tags: |
            ${{ steps.tags.outputs.ai-engine }}
            ${{ steps.tags.outputs.ai-engine-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.nginx
          push: true
          tags: |
            ${{ steps.tags.outputs.nginx }}
            ${{ steps.tags.outputs.nginx-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      frontend_tag: ${{ steps.tags.outputs.frontend }}
      backend_tag: ${{ steps.tags.outputs.backend }}
      ai_engine_tag: ${{ steps.tags.outputs.ai-engine }}
      nginx_tag: ${{ steps.tags.outputs.nginx }}
      short_sha: ${{ steps.tags.outputs.short_sha }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/survey-verification-platform-staging

            export FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend_tag }}
            export BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend_tag }}
            export AI_ENGINE_IMAGE=${{ needs.build-and-push.outputs.ai_engine_tag }}
            export NGINX_IMAGE=${{ needs.build-and-push.outputs.nginx_tag }}

            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans

            echo "Waiting for services to be healthy..."
            sleep 30

            docker compose -f docker-compose.yml -f docker-compose.staging.yml ps

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          STAGING_URL="https://staging.surveyverification.com"
          MAX_RETRIES=5
          RETRY_COUNT=0

          wait_for_healthy() {
            local url=$1
            local name=$2
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url" --max-time 10)
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "$name is healthy (HTTP $HTTP_STATUS)"
                return 0
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Attempt $RETRY_COUNT: $name returned HTTP $HTTP_STATUS, retrying..."
              sleep 10
            done
            echo "$name health check failed after $MAX_RETRIES attempts"
            return 1
          }

          wait_for_healthy "$STAGING_URL" "Frontend"
          wait_for_healthy "$STAGING_URL/api/health" "Backend API"
          wait_for_healthy "$STAGING_URL/ai/health" "AI Engine"

          echo "All smoke tests passed"

      - name: Run API smoke tests
        run: |
          STAGING_URL="https://staging.surveyverification.com"

          echo "Testing survey verification endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$STAGING_URL/api/v1/surveys/verify" \
            -H "Content-Type: application/json" \
            -d '{"test": true}' \
            --max-time 10)

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ] || [ "$HTTP_STATUS" = "401" ]; then
            echo "API smoke test passed (HTTP $HTTP_STATUS)"
          else
            echo "API smoke test failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()
    steps:
      - name: Notify Slack on success
        if: needs.smoke-tests.result == 'success'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Staging deployment succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Staging Deployment Successful*\n*Commit:* `${{ needs.build-and-push.outputs.short_sha }}`\n*Branch:* `${{ github.ref_name }}`\n*Actor:* `${{ github.actor }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.smoke-tests.result == 'failure'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Staging deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Staging Deployment Failed*\n*Commit:* `${{ needs.build-and-push.outputs.short_sha }}`\n*Branch:* `${{ github.ref_name }}`\n*Actor:* `${{ github.actor }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
