changelog:
  exclude:
    labels:
      - "ignore-for-release"
    authors:
      - "dependabot[bot]"
  categories:
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"
        - "bugfix"
    - title: "Security"
      labels:
        - "security"
        - "dependencies"
    - title: "Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "Infrastructure"
      labels:
        - "infrastructure"
        - "ci"
        - "devops"
    - title: "Breaking Changes"
      labels:
        - "breaking-change"
    - title: "Other Changes"
      labels:
        - "*"
