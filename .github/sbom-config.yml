# Syft SBOM Configuration
# Generates CycloneDX and SPDX SBOMs for all project components

# Global configuration
output:
  - cyclonedx-json
  - spdx-json

# Cataloger configuration
catalogers:
  java:
    search:
      scope: all-layers
    maven:
      search:
        scope: all-layers
  javascript:
    search:
      scope: all-layers
  rust-cargo:
    search:
      scope: all-layers

# Output naming convention: sbom-{component}-{format}.{ext}

# Component-specific configurations
components:
  frontend:
    name: survey-platform-frontend
    description: Next.js 15 frontend application
    language: typescript/javascript
    source: ./frontend
    dockerfile: infrastructure/docker/Dockerfile.frontend
    image: ghcr.io/${IMAGE_PREFIX}/frontend
    includes:
      - package.json
      - package-lock.json
      - node_modules/**
    excludes:
      - node_modules/.cache/**
      - node_modules/.package-lock.json
    extra-tags:
      - component:frontend
      - layer:frontend

  backend:
    name: survey-platform-backend
    description: Java 21 Spring Boot backend
    language: java
    source: ./backend
    dockerfile: infrastructure/docker/Dockerfile.backend
    image: ghcr.io/${IMAGE_PREFIX}/backend
    includes:
      - pom.xml
      - target/**/*.jar
    excludes:
      - target/test-classes/**
      - target/**/test*.jar
    extra-tags:
      - component:backend
      - layer:backend

  ai-engine:
    name: survey-platform-ai-engine
    description: Rust AI governance engine
    language: rust
    source: ./ai-engine
    dockerfile: infrastructure/docker/Dockerfile.ai-engine
    image: ghcr.io/${IMAGE_PREFIX}/ai-engine
    includes:
      - Cargo.toml
      - Cargo.lock
    excludes:
      - target/debug/**
    extra-tags:
      - component:ai-engine
      - layer:ai-engine

  blockchain:
    name: survey-platform-blockchain
    description: Solidity smart contracts
    language: solidity/javascript
    source: ./blockchain
    dockerfile: infrastructure/docker/Dockerfile.blockchain
    image: ghcr.io/${IMAGE_PREFIX}/blockchain
    includes:
      - package.json
      - package-lock.json
      - contracts/**/*.sol
    excludes:
      - node_modules/.cache/**
      - artifacts/**
      - cache/**
    extra-tags:
      - component:blockchain
      - layer:blockchain

  nginx:
    name: survey-platform-nginx
    description: Nginx reverse proxy configuration
    language: config
    source: ./infrastructure/nginx
    dockerfile: infrastructure/docker/Dockerfile.nginx
    image: ghcr.io/${IMAGE_PREFIX}/nginx
    includes:
      - nginx.conf
      - conf.d/**
    extra-tags:
      - component:nginx
      - layer:nginx

# Metadata configuration
metadata:
  authors:
    - name: BackOffice Pro (Pty) Ltd
      email: security@backofficepro.co.za
  supplier:
    name: BackOffice Pro (Pty) Ltd
    url: https://backofficepro.co.za
  license: Proprietary
  homepage: https://surveyverification.com
  repository: https://github.com/backofficepro/survey-verification-platform
  vcs: https://github.com/backofficepro/survey-verification-platform.git
