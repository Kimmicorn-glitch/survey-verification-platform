[package]
name = "survey-verification-ai-engine"
version = "1.0.0"
edition = "2021"
authors = ["BackOffice Pro"]
description = "AI Governance Engine for the Survey Verification Platform"
license = "Proprietary"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "chrono", "uuid", "json"] }
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ort = "2.0.0-rc.12"
geo = "0.28"
geohash = "0.13"
thiserror = "2"
anyhow = "1"
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
